services:
  redis:
    image: redis:8.2.1-alpine
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12

  app:
    build: .
    environment:
      WEATHERAPI_KEY: ${WEATHERAPI_KEY:?set WEATHERAPI_KEY in your shell before compose up}
      CACHE_BACKEND: redis
      REDIS_URL: redis://redis:6379
      EXPOSURE_MODE: local
      HOST: 0.0.0.0
      PORT: '3000'
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health/live').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  redis-data:
